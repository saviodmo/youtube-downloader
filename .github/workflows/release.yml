name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir se a tag corresponde à versão
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "A tag ${{ github.ref_name }} não corresponde à versão $version do package.json. Rode 'npm version' antes de publicar."
          }

      # Guarda o FFmpeg entre builds para não baixar ~170 MB toda vez.
      # Para atualizar o FFmpeg, troque a chave (ex.: ffmpeg-lgpl-win64-v2).
      - name: Cache do FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            bin/ffmpeg.exe
            bin/FFmpeg-LICENSE.txt
            bin/FFMPEG-NOTICE.txt
          key: ffmpeg-lgpl-win64-v1

      - name: Gerar os executáveis
        run: npm run build

      - name: Gerar checksums SHA-256
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines("$PWD\dist\SHA256SUMS.txt", $lines)

      - name: Guardar artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: youtube-downloader-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publicar a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: YouTube Downloader ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS.txt
